[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-energy-optimization"
version = "0.1.0"
description = "Day-ahead ML forecasting and constrained microgrid dispatch for PV, BESS, gas and diesel backup."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Pierre Medina"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.37,<2",
  "plotly>=5.22,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
energy-opt = "energy_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
